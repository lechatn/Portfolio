<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="description" content="Le portfolio de Noé LECHAT est en cours de refonte. Revenez bientôt !">
    <title>NL | Site en cours de modification</title>
    <link rel="icon" href="./images/logoNL.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: #ededed;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #081b29;
            padding: 20px 10%;
        }

        header span {
            font-size: 25px;
            font-weight: 600;
            color: #fff;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .badge {
            font-size: 60px;
            color: #96d1d1;
            margin-bottom: 20px;
            animation: spin 6s linear infinite;
        }

        h1 {
            font-size: clamp(32px, 6vw, 56px);
            font-weight: 700;
            line-height: 1.2;
        }

        h1 span {
            color: #96d1d1;
        }

        main p {
            font-size: 20px;
            max-width: 600px;
            margin-top: 20px;
            line-height: 1.5;
        }

        .links {
            margin-top: 35px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .links a {
            padding: 10px 26px;
            border: 2px solid #96d1d1;
            border-radius: 40px;
            color: #96d1d1;
            text-decoration: none;
            font-weight: 600;
            transition: .3s;
        }

        .links a:hover,
        .links a:focus-visible {
            background: #96d1d1;
            color: #081b29;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .badge { animation: none; }
        }
    </style>
</head>
<body>
    <header>
        <span>Portfolio</span>
    </header>
    <main>
        <div class="badge" aria-hidden="true">&#9881;</div>
        <h1>Site en cours de <span>modification</span></h1>
        <p>Mon portfolio fait peau neuve. Le nouveau site sera bientôt disponible, merci de revenir un peu plus tard.</p>
        <div class="links">
            <a href="https://www.linkedin.com/in/noé-lechat-175b90265" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://github.com/lechatn" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
    </main>
    <footer>&copy; 2025 Noé LECHAT</footer>
</body>
</html>
